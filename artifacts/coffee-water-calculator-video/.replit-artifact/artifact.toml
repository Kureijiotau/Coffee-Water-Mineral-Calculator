kind = "video"
previewPath = "/"
title = "Watermancer — Product Walkthrough"
version = "1.0.0"
id = "artifacts/coffee-water-calculator-video"
router = "path"
videoAspectRatio = "16:9"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24178

[services.development]
run = "pnpm --filter @workspace/coffee-water-calculator-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coffee-water-calculator-video", "run", "build" ]
serve = "static"
publicDir = "artifacts/coffee-water-calculator-video/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24178"
BASE_PATH = "/"