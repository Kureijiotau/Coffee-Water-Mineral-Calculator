<div class="qr-options-panel">
  <span class="panel-title">QR OPTIONS</span>
  
  <div class="qr-grid">
    <!-- Card 1: App Payload -->
    <div class="qr-card">
      <div class="qr-header">
        <span class="qr-badge">APP PAYLOAD</span>
      </div>
      
      <div class="qr-wrapper">
        <img src="path-to-app-qr.png" alt="Recipe Data QR" class="qr-code" />
        <div class="qr-icon-center">
          <!-- Droplet / App Icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#00d2c4">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </div>
      </div>
      
      <span class="qr-caption">Scan to import recipe</span>
    </div>

    <!-- Card 2: Share URL -->
    <div class="qr-card">
      <div class="qr-header">
        <span class="qr-badge">SHARE LINK</span>
      </div>
      
      <div class="qr-wrapper">
        <img src="path-to-web-qr.png" alt="Web Link QR" class="qr-code" />
        <div class="qr-icon-center">
          <!-- Link Icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#00d2c4" stroke="#00d2c4" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
      </div>
      
      <span class="qr-caption">Open in browser</span>
    </div>
  </div>
</div>
