name: Build Watermancer for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "watermancer-v*"

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate calculator
        run: |
          pnpm --filter @workspace/coffee-water-calculator run typecheck
          pnpm --filter @workspace/coffee-water-calculator run test -- --run

      - name: Build Windows installer
        working-directory: artifacts/coffee-water-calculator
        run: pnpm run desktop:build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: watermancer-windows-installer
          path: artifacts/coffee-water-calculator/dist/electron/*.exe
          if-no-files-found: error