name: Recipe share-card browser smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  browser-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm --filter @workspace/coffee-water-calculator exec playwright install --with-deps chromium firefox webkit

      - name: Exercise recipe image downloads
        run: pnpm --filter @workspace/coffee-water-calculator run test:browser