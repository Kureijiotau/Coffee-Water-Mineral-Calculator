openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Account-owned calculator data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/sync:
    get:
      operationId: getAccountSyncData
      tags: [account]
      summary: Get the signed-in user's synced calculator data
      responses:
        "200":
          description: Account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSyncData"
        "401":
          description: Authentication required
        "503":
          description: Account sync storage is unavailable
    put:
      operationId: saveAccountSyncData
      tags: [account]
      summary: Save the signed-in user's calculator data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSyncInput"
      responses:
        "200":
          description: Saved account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSyncData"
        "401":
          description: Authentication required
        "409":
          description: The account data changed since it was read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSyncConflict"
        "503":
          description: Account sync storage is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IonRange:
      type: object
      properties:
        greenMax:
          type: number
          minimum: 0
        yellowMax:
          type: number
          minimum: 0
      required: [greenMax, yellowMax]
      additionalProperties: false
    AlchemistProfile:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          maxLength: 200
        ranges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IonRange"
        locked:
          type: boolean
        description:
          type: string
          maxLength: 2000
      required: [id, name, ranges, locked]
      additionalProperties: true
    IonicTargets:
      type: object
      additionalProperties:
        type: number
        minimum: 0
    WatermancerProfile:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          maxLength: 200
        targets:
          $ref: "#/components/schemas/IonicTargets"
        finishedIons:
          $ref: "#/components/schemas/IonicTargets"
        source:
          type: string
          maxLength: 500
        sourceUrl:
          type: string
          maxLength: 2000
        details:
          type: string
          maxLength: 4000
      required: [id, name, targets]
      additionalProperties: true
    DiyConcentrateInputs:
      type: object
      properties:
        stockWeightInput:
          type: string
          maxLength: 100
        stockVolumeInput:
          type: string
          maxLength: 100
        finalVolumeInput:
          type: string
          maxLength: 100
        calibrationDropsInput:
          type: string
          maxLength: 100
        calibrationWeightInput:
          type: string
          maxLength: 100
        desiredPpmInput:
          type: string
          maxLength: 100
        desiredSaltMgInput:
          type: string
          maxLength: 100
        desiredDoseBasis:
          type: string
          enum: [caco3, salt-mg]
      additionalProperties: false
    WaterTastingCoffeeDetails:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        roast:
          type: string
          maxLength: 200
        origin:
          type: string
          maxLength: 200
        brewMethod:
          type: string
          maxLength: 200
      additionalProperties: false
    WaterTastingRatings:
      type: object
      properties:
        clarity:
          type: integer
          minimum: 0
          maximum: 10
        flavorExpression:
          type: integer
          minimum: 0
          maximum: 10
        balance:
          type: integer
          minimum: 0
          maximum: 10
        mouthfeel:
          type: integer
          minimum: 0
          maximum: 10
        finish:
          type: integer
          minimum: 0
          maximum: 10
      additionalProperties: false
    WaterTastingSpectrum:
      type: object
      properties:
        acidityFocus:
          type: integer
          minimum: -5
          maximum: 5
        bodyWeight:
          type: integer
          minimum: -5
          maximum: 5
        structure:
          type: integer
          minimum: -5
          maximum: 5
        finish:
          type: integer
          minimum: -5
          maximum: 5
      required: [acidityFocus, bodyWeight, structure, finish]
      additionalProperties: false
    WaterTastingDescriptiveScores:
      type: object
      properties:
        fragrance:
          type: integer
          minimum: 0
          maximum: 15
        aroma:
          type: integer
          minimum: 0
          maximum: 15
        flavor:
          type: integer
          minimum: 0
          maximum: 15
        aftertaste:
          type: integer
          minimum: 0
          maximum: 15
        acidity:
          type: integer
          minimum: 0
          maximum: 15
        sweetness:
          type: integer
          minimum: 0
          maximum: 15
        mouthfeel:
          type: integer
          minimum: 0
          maximum: 15
      additionalProperties: false
    WaterTastingAffectiveScores:
      type: object
      properties:
        fragranceAroma:
          type: integer
          minimum: 1
          maximum: 9
        flavorAftertaste:
          type: integer
          minimum: 1
          maximum: 9
        acidity:
          type: integer
          minimum: 1
          maximum: 9
        mouthfeel:
          type: integer
          minimum: 1
          maximum: 9
        overall:
          type: integer
          minimum: 1
          maximum: 9
      additionalProperties: false
    WaterTastingLegacyRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        profileSourceId:
          type: string
          minLength: 1
          maxLength: 500
        profileNameSnapshot:
          type: string
          minLength: 1
          maxLength: 500
        coffee:
          $ref: "#/components/schemas/WaterTastingCoffeeDetails"
        descriptorIds:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
        ratings:
          $ref: "#/components/schemas/WaterTastingRatings"
        spectrum:
          $ref: "#/components/schemas/WaterTastingSpectrum"
        notes:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, profileSourceId, profileNameSnapshot, coffee, descriptorIds, ratings, createdAt, updatedAt]
      additionalProperties: false
    WaterTastingCvaRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        profileSourceId:
          type: string
          minLength: 1
          maxLength: 500
        profileNameSnapshot:
          type: string
          minLength: 1
          maxLength: 500
        coffee:
          $ref: "#/components/schemas/WaterTastingCoffeeDetails"
        descriptorIds:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
        scoringVersion:
          type: integer
          enum: [2]
        descriptive:
          $ref: "#/components/schemas/WaterTastingDescriptiveScores"
        affective:
          $ref: "#/components/schemas/WaterTastingAffectiveScores"
        notes:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, profileSourceId, profileNameSnapshot, coffee, descriptorIds, scoringVersion, descriptive, affective, createdAt, updatedAt]
      additionalProperties: false
    WaterTastingRecord:
      oneOf:
        - $ref: "#/components/schemas/WaterTastingLegacyRecord"
        - $ref: "#/components/schemas/WaterTastingCvaRecord"
    WaterTastingDeletion:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        deletedAt:
          type: string
          format: date-time
      required: [id, deletedAt]
      additionalProperties: false
    AccountSyncData:
      type: object
      properties:
        revision:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, "null"]
          format: date-time
        alchemistProfiles:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/AlchemistProfile"
        watermancerProfiles:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/WatermancerProfile"
        diyConcentrateInputs:
          oneOf:
            - $ref: "#/components/schemas/DiyConcentrateInputs"
            - type: "null"
        waterTastings:
          type: array
          items:
            $ref: "#/components/schemas/WaterTastingRecord"
        waterTastingDeletions:
          type: array
          items:
            $ref: "#/components/schemas/WaterTastingDeletion"
      required:
        - revision
        - updatedAt
        - alchemistProfiles
        - watermancerProfiles
        - diyConcentrateInputs
        - waterTastings
        - waterTastingDeletions
    AccountSyncInput:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        alchemistProfiles:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/AlchemistProfile"
        watermancerProfiles:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/WatermancerProfile"
        diyConcentrateInputs:
          oneOf:
            - $ref: "#/components/schemas/DiyConcentrateInputs"
            - type: "null"
        waterTastings:
          type: array
          items:
            $ref: "#/components/schemas/WaterTastingRecord"
        waterTastingDeletions:
          type: array
          items:
            $ref: "#/components/schemas/WaterTastingDeletion"
      required:
        - expectedRevision
        - alchemistProfiles
        - watermancerProfiles
        - diyConcentrateInputs
        - waterTastings
        - waterTastingDeletions
      additionalProperties: false
    AccountSyncConflict:
      type: object
      properties:
        current:
          $ref: "#/components/schemas/AccountSyncData"
      required: [current]
